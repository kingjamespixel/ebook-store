name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          {
            echo '## Test results'
            echo '```'
            grep -E '^ℹ (tests|pass|fail)' test-output.txt || true
            echo '```'
            if grep -q '^✖' test-output.txt; then
              echo '### Failures'
              echo '```'
              grep -A 12 '^✖' test-output.txt | head -150
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
