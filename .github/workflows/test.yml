name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          {
            echo '## Test results'
            echo '```'
            grep -E '^(ℹ|#) (tests|pass|fail) ' test-output.txt || true
            echo '```'
            if grep -qE '^(✖|not ok)' test-output.txt; then
              echo '### Failures'
              echo '```'
              grep -E -A 14 '^(✖|not ok)' test-output.txt | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are visible on the run page without signing in.
          grep -E '^(✖|not ok) ' test-output.txt | grep -v 'failing tests' | sort -u | head -10 | while read -r line; do
            echo "::error title=Failing test::${line}"
          done
          grep -E -A 6 '^(✖|not ok) ' test-output.txt | grep -E "(error|Error|expected|actual|message):" | sort -u | head -10 | while read -r line; do
            echo "::warning title=Failure detail::${line}"
          done
      - run: npm run build
